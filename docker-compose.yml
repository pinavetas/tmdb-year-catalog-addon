services:
  tmdb-year-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stremio-tmdb-year-catalog
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-en-US}
      - DEFAULT_MIN_VOTES_MOVIE=${DEFAULT_MIN_VOTES_MOVIE:-200}
      - DEFAULT_MIN_VOTES_SERIES=${DEFAULT_MIN_VOTES_SERIES:-50}
